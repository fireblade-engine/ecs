name: Documentation

on:
  push:
    branches: [ main ]
    tags: [ '*.*.*', 'v*.*.*' ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      backfill_tags:
        description: 'Backfill historical tag documentation'
        required: false
        type: boolean
        default: false

# Pull requests are grouped per ref (an unrelated label event gets its own group) and cancel older runs. Every tag has its
# own group and every manual run gets one per run, so neither is cancelled or replaced by another run. Main pushes share one
# group where a newer pending run may replace an older pending one (the newest main wins). Nothing is cancelled mid-publish,
# and publishing itself is safe against overlapping runs (Scripts/publish-gh-pages.sh).
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('{0}-{1}{2}', github.workflow, github.ref, (github.event.action == 'labeled' && github.event.label.name != 'run-docs') && format('-{0}', github.run_id) || '')
    || (github.ref_type == 'tag' && format('{0}-tag-{1}', github.workflow, github.ref)
    || (github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}', github.workflow, github.run_id) || format('{0}-main', github.workflow))) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Build Documentation
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'run-docs') || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-docs'))
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      docs_version_path: ${{ steps.version.outputs.docs_version_path }}
      report_published: ${{ steps.report.outputs.report_published }}
      report_failed: ${{ steps.report.outputs.report_failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version Path
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            DOCS_VERSION_PATH="$REF_NAME"
          else
            DOCS_VERSION_PATH=main
          fi
          echo "DOCS_VERSION_PATH=$DOCS_VERSION_PATH" >> "$GITHUB_ENV"
          echo "docs_version_path=$DOCS_VERSION_PATH" >> "$GITHUB_OUTPUT"

      # Reports are sporadic and belong to the version they measure. Only tag runs publish one, and only when the committed
      # manifest names this tag. A report that fails the drift check is withheld and the job fails later (report-gate),
      # after the documentation itself was published.
      - name: Stage Benchmark Report
        id: report
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          status=0
          ./Scripts/stage-benchmark-report.sh "$REF_NAME" .build/benchmark-reports "$SHA" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "report_failed=true" >> "$GITHUB_OUTPUT"
          elif [ -f ".build/benchmark-reports/$REF_NAME.html" ]; then
            echo "report_published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Backfill Historical Tags
        if: github.event.inputs.backfill_tags == 'true'
        run: make docs-backfill-tags

      - name: Build Documentation
        env:
          VERSION_PATH: ${{ env.DOCS_VERSION_PATH }}
        run: make docs-generate REPO_NAME=ecs DOCS_VERSION_PATH="$VERSION_PATH"

      - name: Check Documentation Quality
        run: |
          make docs-check-coverage
          make docs-check-links

      - name: Persist to gh-pages
        if: github.event_name != 'pull_request'
        env:
          REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          BACKFILL: ${{ github.event.inputs.backfill_tags }}
        run: |
          # Publish only the version directories this run built; the shared root files are regenerated from the fresh clone.
          PUBLISH_PATHS="$DOCS_VERSION_PATH"
          if [ "$BACKFILL" = "true" ]; then
            PUBLISH_PATHS="$PUBLISH_PATHS $(find .build/documentation -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | tr '\n' ' ')"
          fi
          export PUBLISH_PATHS
          ./Scripts/publish-gh-pages.sh

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: .build/documentation

  # Deploys whatever gh-pages holds at this moment, not what this run built, so a replaced pending deploy is harmless and
  # a deploy can never bring back older content than another run already published.
  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Prepare Pages artifact
        run: rm -rf site/.git

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report-gate:
    name: Benchmark Report Release Check
    # Independent of deploy: a cancelled or replaced deploy must not swallow the failure.
    needs: [build-docs]
    if: always() && needs.build-docs.result == 'success' && needs.build-docs.outputs.report_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail on withheld benchmark report
        run: |
          echo "::error title=Benchmark report withheld::The report for this tag failed the release check (code changed since the measured commit, or manifest and page disagree). The documentation was published without it. Fix with make check-release-report, then move the tag."
          exit 1

  # Skipped when this run's deploy was replaced by a newer one: that deploy publishes the same (or newer) gh-pages HEAD.
  smoke-test:
    name: Post-Deployment Smoke Test
    needs: [build-docs, deploy]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check Documentation URL
        run: |
          sleep 10
          curl --fail -sL https://fireblade-engine.github.io/ecs/main/documentation/firebladeecs/ | grep -q "Documentation"
          echo "Documentation is live at /ecs/main/"
      
      - name: Check Root Redirects
        run: |
          curl -s https://fireblade-engine.github.io/ecs/ | grep -q "Redirecting to Latest Docs"
          echo "Root redirect is live at /ecs/ and points to latest docs"

      - name: Check Benchmark Report
        if: github.ref_type == 'tag' && needs.build-docs.outputs.report_published == 'true'
        env:
          VERSION_PATH: ${{ needs.build-docs.outputs.docs_version_path }}
        run: |
          curl --fail -sSL --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "https://fireblade-engine.github.io/ecs/benchmarks/$VERSION_PATH/"
          echo "Benchmark report is live at /ecs/benchmarks/$VERSION_PATH/"
          curl --fail -sSL --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null https://fireblade-engine.github.io/ecs/benchmarks/
          echo "Benchmark landing page is live at /ecs/benchmarks/"
