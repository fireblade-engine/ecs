name: Lint

# Runs only when files that `make lint` scans or configures change.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'Sources/**/*.swift'
      - 'Tests/**/*.swift'
      - '.swiftlint.yml'
      - '.swiftformat'
      - 'Mintfile'
      - 'Makefile'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Sources/**/*.swift'
      - 'Tests/**/*.swift'
      - '.swiftlint.yml'
      - '.swiftformat'
      - 'Mintfile'
      - 'Makefile'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (SwiftLint, SwiftFormat)
    runs-on: ubuntu-latest
    # The image tag pins the exact toolchain; Renovate proposes patch updates. SwiftLint needs the
    # toolchain's SourceKit, otherwise it silently skips the rules that depend on it.
    container: swift:${{ matrix.swift-full }}-noble
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - swift: "6.2"
            # renovate: datasource=docker depName=swift
            swift-full: "6.2.4"
    steps:
      - name: Install System Packages
        run: |
          if ! command -v curl > /dev/null || ! command -v unzip > /dev/null; then
            apt-get update && apt-get install -y --no-install-recommends curl ca-certificates unzip
          fi

      - name: Checkout
        uses: actions/checkout@v7

      # The Mintfile is the single source of truth for the linter versions; Mint has no Linux
      # release, so the prebuilt Linux release binaries of the same versions are used instead.
      - name: Install Linters
        run: |
          swiftlint_version=$(sed -n 's|^realm/SwiftLint@||p' Mintfile)
          swiftformat_version=$(sed -n 's|^nicklockwood/SwiftFormat@||p' Mintfile)
          test -n "$swiftlint_version" && test -n "$swiftformat_version"
          case "$(uname -m)" in
            x86_64) lint_asset=swiftlint_linux_amd64.zip; format_asset=swiftformat_linux.zip ;;
            aarch64) lint_asset=swiftlint_linux_arm64.zip; format_asset=swiftformat_linux_aarch64.zip ;;
            *) echo "::error::Unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/linters"
          cd "$RUNNER_TEMP/linters"
          curl -fsSL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${swiftlint_version}/${lint_asset}"
          curl -fsSL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${swiftformat_version}/${format_asset}"
          unzip -oq swiftlint.zip -d swiftlint
          unzip -oq swiftformat.zip -d swiftformat
          chmod +x swiftlint/swiftlint swiftformat/swiftformat_linux*
          # The dynamic swiftlint binary (not swiftlint-static, which skips the SourceKit rules)
          # loads SourceKit from the container's toolchain.
          sourcekit=$(find /usr -name libsourcekitdInProc.so | head -1)
          test -n "$sourcekit"
          echo "LINUX_SOURCEKIT_LIB_PATH=$(dirname "$sourcekit")" >> "$GITHUB_ENV"
          echo "SWIFTLINT=$PWD/swiftlint/swiftlint" >> "$GITHUB_ENV"
          echo "SWIFTFORMAT=$(ls "$PWD"/swiftformat/swiftformat_linux*)" >> "$GITHUB_ENV"
          [ "$("$PWD/swiftlint/swiftlint" --version)" = "$swiftlint_version" ]
          [ "$("$PWD"/swiftformat/swiftformat_linux* --version)" = "$swiftformat_version" ]

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          make lint 2>&1 | tee "$RUNNER_TEMP/lint.log"
          # Fail if SwiftLint skipped rules (e.g. SourceKit not found): CI must enforce the local rule set.
          ! grep -F "Skipping enabled rule" "$RUNNER_TEMP/lint.log"
