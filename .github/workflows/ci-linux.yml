name: Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "6.2"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import Swift GPG keys
        # setup-swift v3 verifies swiftly with an empty keyring (swift-actions/setup-swift#798)
        run: curl -fsSL --compressed https://www.swift.org/keys/all-keys.asc | gpg --import -

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.swift }}

      - name: Run Tests (Release)
        run: swift test -c release --parallel -Xswiftc -warnings-as-errors
