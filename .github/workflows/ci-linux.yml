name: Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    # The image tag pins the exact toolchain; Renovate proposes patch updates.
    container: swift:${{ matrix.swift-full }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.1"
            # renovate: datasource=docker depName=swift
            swift-full: "6.1.3"
          - swift: "6.2"
            # renovate: datasource=docker depName=swift
            swift-full: "6.2.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Swift Version
        run: |
          swift --version
          swift --version 2>&1 | grep -qF "Swift version ${{ matrix.swift-full }} (" || {
            echo "::error::Expected Swift ${{ matrix.swift-full }}"
            exit 1
          }

      # Caches only depend on the toolchain and the dependency graph, so they hold the expensive
      # swift-syntax build; this package's own modules are rebuilt incrementally.
      # PRs restore master's cache, only master saves it.
      - name: Restore Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-linux-${{ matrix.swift-full }}-release-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Run Tests (Release)
        run: swift test -c release --parallel -Xswiftc -warnings-as-errors

      - name: Save Build Cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
