name: WASM

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm:
    name: WASM (Swift ${{ matrix.config.version }})
    runs-on: ubuntu-latest
    # The image tag pins the exact toolchain; it must match the Swift SDK below.
    container: swift:${{ matrix.config.version }}-noble
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        config:
          - version: 6.2.1
            url: https://download.swift.org/swift-6.2.1-release/wasm-sdk/swift-6.2.1-RELEASE/swift-6.2.1-RELEASE_wasm.artifactbundle.tar.gz
            checksum: 482b9f95462b87bedfafca94a092cf9ec4496671ca13b43745097122d20f18af
            sdk: swift-6.2.1-RELEASE_wasm
            platform: wasm32-unknown-wasip1
        build:
          - release

    steps:
      - uses: actions/checkout@v7

      - name: Verify Swift Version
        run: |
          swift --version
          swift --version 2>&1 | grep -qF "Swift version ${{ matrix.config.version }} (" || {
            echo "::error::Expected Swift ${{ matrix.config.version }}"
            exit 1
          }

      # The wasmtime release is a .tar.xz; the swift image ships without xz.
      - name: Install xz
        run: apt-get update -q && apt-get install -yq --no-install-recommends xz-utils

      - uses: bytecodealliance/actions/wasmtime/setup@v1

      - name: Install Swift SDK
        run: |
          for attempt in 1 2 3; do
            swift sdk install ${{ matrix.config.url }} --checksum ${{ matrix.config.checksum }} && exit 0
            echo "::warning::Swift SDK download failed (attempt $attempt)"
            sleep 15
          done
          exit 1

      # PRs restore master's cache, only master saves it.
      - name: Restore Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-wasm-${{ matrix.config.version }}-${{ matrix.build }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Build for testing
        run: |
          swift build --build-tests -c ${{ matrix.build }} --swift-sdk ${{ matrix.config.sdk }} -Xswiftc -enable-testing

      - name: Save Build Cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Test
        run: |
          wasmtime --dir . .build/${{ matrix.config.platform }}/${{ matrix.build }}/FirebladeECSPackageTests.xctest --testing-library swift-testing
