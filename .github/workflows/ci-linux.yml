name: Linux

on:
  push:
    branches: [ master, main ]
  # PRs into master run automatically. PRs into any other branch (e.g. stacked PRs) run when they carry
  # the `run-ci` label (all platforms) or `run-ci-linux` (this platform only); later pushes then rerun.
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

concurrency:
  # A run started by an unrelated label gets its own group, so it never cancels a run in progress.
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.event.label.name != 'run-ci-linux') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-linux')) ||
      (github.event.action != 'labeled' && (github.base_ref == 'master' || github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'run-ci') || contains(github.event.pull_request.labels.*.name, 'run-ci-linux')))
    name: Linux (Swift ${{ matrix.swift }})
    runs-on: ubuntu-latest
    # The image tag pins the exact toolchain; Renovate proposes patch updates.
    container: swift:${{ matrix.swift-full }}-noble
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: "6.2"
            # renovate: datasource=docker depName=swift
            swift-full: "6.2.4"
            # Older swift-syntax with a published prebuilt for this exact toolchain: saves ~3 min
            # on cold builds and covers the lower end of the supported swift-syntax range.
            swift-syntax: "602.0.0"
            swift-syntax-revision: "4799286537280063c85a32f09884cfbca301b1a1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Swift Version
        run: |
          swift --version
          swift --version 2>&1 | grep -qF "Swift version ${{ matrix.swift-full }} (" || {
            echo "::error::Expected Swift ${{ matrix.swift-full }}"
            exit 1
          }

      # Caches only depend on the toolchain and the dependency graph, so they hold the expensive
      # swift-syntax build; this package's own modules are rebuilt incrementally.
      # PRs restore master's cache, only master saves it.
      - name: Restore Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-linux-${{ matrix.swift-full }}-swift-syntax-${{ matrix.swift-syntax || 'resolved' }}-release-${{ hashFiles('Package.swift', 'Package.resolved') }}

      # Rewrites the pin instead of re-resolving: resolving from Package.resolved first would check out
      # its version over the cached one and invalidate the whole cached build.
      - name: Pin swift-syntax ${{ matrix.swift-syntax }}
        if: matrix.swift-syntax != ''
        run: |
          sed -i -e '/"identity" : "swift-syntax"/,/}/{s/"revision" : "[^"]*"/"revision" : "${{ matrix.swift-syntax-revision }}"/;s/"version" : "[^"]*"/"version" : "${{ matrix.swift-syntax }}"/;}' Package.resolved
          grep -A6 '"identity" : "swift-syntax"' Package.resolved | grep -qF '"version" : "${{ matrix.swift-syntax }}"'

      - name: Run Tests (Release)
        run: swift test -c release --parallel -Xswiftc -warnings-as-errors

      - name: Save Build Cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
