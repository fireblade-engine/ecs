name: Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows (Swift ${{ matrix.swift }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1", "6.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Windows
        uses: brightdigit/swift-build@v1.5.8
        with:
          windows-swift-version: swift-${{ matrix.swift }}-release
          windows-swift-build: ${{ matrix.swift }}-RELEASE
          scheme: FirebladeECS
          # args: swift test -c release --parallel -Xswiftc -warnings-as-errors
