name: Windows

on:
  push:
    branches: [ master, main ]
  # PRs into master run automatically. PRs into any other branch (e.g. stacked PRs) run when they carry
  # the `run-ci` label (all platforms) or `run-ci-windows` (this platform only); later pushes then rerun.
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

concurrency:
  # A run started by an unrelated label gets its own group, so it never cancels a run in progress.
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.event.label.name != 'run-ci-windows') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-windows')) ||
      (github.event.action != 'labeled' && (github.base_ref == 'master' || github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'run-ci') || contains(github.event.pull_request.labels.*.name, 'run-ci-windows')))
    name: Windows (Swift ${{ matrix.swift }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test Windows
        uses: brightdigit/swift-build@v1.5.8
        with:
          windows-swift-version: swift-${{ matrix.swift }}-release
          windows-swift-build: ${{ matrix.swift }}-RELEASE
          scheme: FirebladeECS
          # args: swift test -c release --parallel -Xswiftc -warnings-as-errors
