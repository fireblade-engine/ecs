name: macOS

on:
  push:
    branches: [ main, master ]
  # PRs into main run automatically. PRs into any other branch (e.g. stacked PRs) run when they carry
  # the `run-ci` label (all platforms) or `run-ci-macos` (this platform only); later pushes then rerun.
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:

concurrency:
  # A run started by an unrelated label gets its own group, so it never cancels a run in progress.
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'run-ci' && github.event.label.name != 'run-ci-macos') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action == 'labeled' && (github.event.label.name == 'run-ci' || github.event.label.name == 'run-ci-macos')) ||
      (github.event.action != 'labeled' && (github.base_ref == 'master' || github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'run-ci') || contains(github.event.pull_request.labels.*.name, 'run-ci-macos')))
    name: macOS (Swift ${{ matrix.swift }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each entry pins the Xcode whose bundled toolchain provides the Swift version under test;
          # the runner's default Xcode moves on with image updates.
          - swift: "6.2"
            swift-full: "6.2.4"
            runner: "macos-26"
            xcode: "26.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          DEVELOPER_DIR="/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Verify Swift Version
        run: |
          xcodebuild -version
          swift --version
          swift --version 2>&1 | grep -qF "Swift version ${{ matrix.swift-full }} (" || {
            echo "::error::Xcode ${{ matrix.xcode }} does not provide Swift ${{ matrix.swift-full }}"
            exit 1
          }

      # Caches only depend on the toolchain and the dependency graph, so they hold the expensive
      # swift-syntax build; this package's own modules are rebuilt incrementally.
      # PRs restore main's cache, only main saves it.
      - name: Restore Build Cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: .build
          key: spm-macos-xcode${{ matrix.xcode }}-release-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Run Tests (Release)
        run: swift test -c release --parallel -Xswiftc -warnings-as-errors

      - name: Save Build Cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
