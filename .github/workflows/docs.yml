name: Documentation

on:
  push:
    branches: [ main ]
    tags: [ '*.*.*', 'v*.*.*' ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, labeled ]
  workflow_dispatch:
    inputs:
      backfill_tags:
        description: 'Backfill historical tag documentation'
        required: false
        type: boolean
        default: false

# Pull requests are grouped per ref (an unrelated label event gets its own group). Every publishing run (main, tags, manual)
# shares one group and is never cancelled mid-publish; the publish itself is also safe against overlapping runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}{2}', github.workflow, github.ref, (github.event.action == 'labeled' && github.event.label.name != 'run-docs') && format('-{0}', github.run_id) || '') || format('{0}-publish', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Build Documentation
    if: github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'run-docs') || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'run-docs'))
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      docs_version_path: ${{ steps.version.outputs.docs_version_path }}
      has_benchmark_report: ${{ steps.report.outputs.has_benchmark_report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version Path
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            DOCS_VERSION_PATH="$REF_NAME"
          else
            DOCS_VERSION_PATH=main
          fi
          echo "DOCS_VERSION_PATH=$DOCS_VERSION_PATH" >> "$GITHUB_ENV"
          echo "docs_version_path=$DOCS_VERSION_PATH" >> "$GITHUB_OUTPUT"

      - name: Check Release Benchmark Report
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: make check-release-report VERSION="$REF_NAME" TO="$SHA"

      - name: Detect Benchmark Report
        id: report
        run: |
          if [ -f Documentation/Benchmarks/BenchmarkReport.html ]; then
            echo "has_benchmark_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_benchmark_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backfill Historical Tags
        if: github.event.inputs.backfill_tags == 'true'
        run: make docs-backfill-tags

      - name: Build Documentation
        run: make docs-generate REPO_NAME=ecs DOCS_VERSION_PATH=${{ env.DOCS_VERSION_PATH }}

      - name: Check Documentation Quality
        run: |
          make docs-check-coverage
          make docs-check-links

      - name: Persist to gh-pages
        if: github.event_name != 'pull_request'
        env:
          REMOTE_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          BACKFILL: ${{ github.event.inputs.backfill_tags }}
        run: |
          # Publish only the version directories this run built; the shared root files are regenerated from the fresh clone.
          PUBLISH_PATHS="$DOCS_VERSION_PATH"
          if [ "$BACKFILL" = "true" ]; then
            PUBLISH_PATHS="$PUBLISH_PATHS $(find .build/documentation -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | tr '\n' ' ')"
          fi
          export PUBLISH_PATHS
          ./Scripts/publish-gh-pages.sh

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/gh-pages-publish

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: .build/documentation

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke-test:
    name: Post-Deployment Smoke Test
    needs: [build-docs, deploy]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check Documentation URL
        run: |
          sleep 10
          curl --fail -sL https://fireblade-engine.github.io/ecs/main/documentation/firebladeecs/ | grep -q "Documentation"
          echo "Documentation is live at /ecs/main/"
      
      - name: Check Root Redirects
        run: |
          curl -s https://fireblade-engine.github.io/ecs/ | grep -q "Redirecting to Latest Docs"
          echo "Root redirect is live at /ecs/ and points to latest docs"

      - name: Check Benchmark Report
        if: needs.build-docs.outputs.has_benchmark_report == 'true'
        env:
          DOCS_VERSION_PATH: ${{ needs.build-docs.outputs.docs_version_path }}
        run: |
          curl --fail -sSL --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "https://fireblade-engine.github.io/ecs/$DOCS_VERSION_PATH/benchmarks/BenchmarkReport.html"
          echo "Benchmark report is live at /ecs/$DOCS_VERSION_PATH/benchmarks/"

      - name: Check Latest Benchmark Report Redirect
        if: github.ref_type == 'tag' && needs.build-docs.outputs.has_benchmark_report == 'true'
        run: |
          curl --fail -sSL --retry 6 --retry-delay 10 --retry-all-errors https://fireblade-engine.github.io/ecs/latest/benchmarks/BenchmarkReport.html | grep -q "Redirecting to Latest Benchmark Report"
          echo "Latest benchmark redirect is live at /ecs/latest/benchmarks/"
